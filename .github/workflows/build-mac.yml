- name: Build executable
        run: |
          pyinstaller --clean --windowed main.py \
            --paths=. \
            --add-data "$(python -c 'import certifi; print(certifi.where())'):."
          
          # Ad-hoc code sign
          codesign --force --deep --sign - dist/main.app

      - name: Zip the app
        run: |
          cd dist
          zip -r main.zip main.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-executable
          path: dist/main.zip